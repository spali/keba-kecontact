# Publishes keba-kecontact-spali to PyPI whenever master carries a version
# that is not on PyPI yet. master is rebased onto upstream by the central
# fork sync, so a new upstream version is published right after the sync.
name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check version on PyPI
        id: check
        run: |
          name=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')
          version=$(uv run --no-project python -c 'import re; print(re.search(r"^__version__ = \"([^\"]+)\"", open("keba_kecontact/__init__.py").read(), re.M).group(1))')
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$version/json")
          case $status in
            200) publish=false ;;
            404) publish=true ;;
            *) echo "::error::PyPI answered $status for $name $version"; exit 1 ;;
          esac
          echo "$name $version: publish=$publish" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Test
        run: uv run --extra dev pytest
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish ${{ needs.build.outputs.version }} to PyPI
    needs: build
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/keba-kecontact-spali
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
